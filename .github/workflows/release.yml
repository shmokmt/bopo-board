name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create app bundle structure
        run: |
          mkdir -p BopoBoard.app/Contents/MacOS
          cp BopoBoard/App/Info.plist BopoBoard.app/Contents/Info.plist

      - name: Stamp version into bundle
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" BopoBoard.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" BopoBoard.app/Contents/Info.plist

      - name: Build app
        run: ./build.sh

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./create-dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "BopoBoard-${{ steps.version.outputs.VERSION }}.dmg" \
            --title "BopoBoard ${{ github.ref_name }}" \
            --generate-notes
